<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17253e"><title>Minu CD-kogu</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><header><h1>💿 Minu CD-kogu</h1><nav><button data-tab="browse" class="active">Sirvi</button><button data-tab="add">Lisa</button><button data-tab="archive">Arhiiv</button></nav></header><main><section id="browse" class="page"><input id="search" placeholder="Otsi artisti, teemat või pealkirja"><div id="browseList"></div></section><section id="add" class="page hidden"><h2 id="formTitle">Lisa CD</h2><form id="cdForm"><label>Plaadi tüüp<select id="kind"><option value="artist">Artist</option><option value="theme">Teema</option></select></label><label id="primaryLabel">Artisti nimi *<input id="primary" required></label><label>Pealkiri (valikuline)<input id="albumTitle"></label><label>Pilt (valikuline)<input id="photo" type="file" accept="image/*"></label><div id="photoInfo"></div><h3>Lood</h3><div id="tracks"></div><button type="button" id="addTrack" class="secondary">+ Lisa lugu</button><div class="actions"><button type="submit">Salvesta CD</button><button type="button" id="cancelEdit" class="secondary hidden">Tühista muutmine</button></div></form></section><section id="archive" class="page hidden"><h2>Arhiiv</h2><div id="archiveList"></div></section><section class="backup"><h2>Varukoopia</h2><p>Varukoopia sisaldab CD-de andmeid ja fotosid. Hoia faili turvalises kohas.</p><button id="exportBtn" class="secondary">Ekspordi varukoopia</button><label class="importLabel">Impordi varukoopia<input id="importFile" type="file" accept="application/json,.json" hidden></label></section></main><dialog id="imageDialog"><button id="closeImage" class="secondary">Sulge</button><img id="largeImage" alt="CD foto"></dialog><script src="script.js"></script><script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
